apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sticker-bank
resources:
  - ../../base
  # Pick exactly ONE ingress (default: Option A, LAN via Traefik + cert-manager).
  # For Option B (Tailscale), replace the line below with ingress-tailscale.yaml.
  # Keep the chosen hostname forever: it is the PWA origin, and changing it loses
  # the installed app, its cache, and the browser-stored data on every device.
  - ingress-lan.yaml
  # - ingress-tailscale.yaml
  # Optional in-cluster MySQL (skip if you bring your own server):
  # - ../../optional/mysql
images:
  - name: registry.example.com/sticker-bank
    newName: registry.example.com/sticker-bank
    newTag: 1.0.0   # always a pinned version, never "latest"
