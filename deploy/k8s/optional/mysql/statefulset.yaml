apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sticker-bank-mysql
  labels:
    app.kubernetes.io/name: sticker-bank-mysql
spec:
  serviceName: sticker-bank-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sticker-bank-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sticker-bank-mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The official image's mysql user is UID/GID 999; fsGroup makes the PVC writable.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          env:
            - name: MYSQL_DATABASE
              value: sticker_bank
          envFrom:
            - secretRef:
                name: sticker-bank-mysql
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
