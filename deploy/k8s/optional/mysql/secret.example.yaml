# DOCUMENTATION ONLY. Not referenced by any kustomization. Never commit real values.
#   kubectl -n sticker-bank create secret generic sticker-bank-mysql \
#     --from-literal=MYSQL_ROOT_PASSWORD='<strong-root-password>' \
#     --from-literal=MYSQL_USER='<db-user>' \
#     --from-literal=MYSQL_PASSWORD='<strong-password>'
# MYSQL_USER / MYSQL_PASSWORD must equal the values in Secret sticker-bank-db.
apiVersion: v1
kind: Secret
metadata:
  name: sticker-bank-mysql
  namespace: sticker-bank
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_ME
  MYSQL_USER: REPLACE_ME
  MYSQL_PASSWORD: REPLACE_ME
