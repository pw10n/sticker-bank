# Nightly logical backup to the PVC "sticker-bank-backups".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sticker-bank-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sticker-bank-backup
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sticker-bank-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: mysql:8.4
              envFrom:
                - secretRef:
                    name: sticker-bank-mysql
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  set -o pipefail 2>/dev/null || true
                  f=/backups/sticker_bank-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
                  # --routines is REQUIRED: it includes the stored procedure
                  # reset_parent_pin, which the PIN-reset runbook depends on.
                  MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -h sticker-bank-mysql -uroot \
                    --single-transaction --routines --triggers sticker_bank | gzip > "$f.tmp"
                  mv "$f.tmp" "$f"
                  find /backups -name 'sticker_bank-*.sql.gz' -mtime +30 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: sticker-bank-backups
