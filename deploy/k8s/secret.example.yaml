# DOCUMENTATION ONLY. Never commit real values. Create the real Secret with:
#   kubectl -n sticker-bank create secret generic sticker-bank-db \
#     --from-literal=SPRING_DATASOURCE_USERNAME='<db-user>' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: sticker-bank-db
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: REPLACE_ME
  SPRING_DATASOURCE_PASSWORD: REPLACE_ME
