apiVersion: apps/v1
kind: Deployment
metadata:
  name: sticker-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sticker-bank
  template:
    metadata:
      labels:
        app: sticker-bank
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: registry.example.com/sticker-bank:1.0.0 # always a pinned tag
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.example.com:3306/sticker_bank?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          envFrom:
            - secretRef:
                name: sticker-bank-db
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
